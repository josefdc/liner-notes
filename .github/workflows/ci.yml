name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: newer pushes cancel older runs. main: one group per commit, so every merge is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The parent commit holds the base branch's guard baselines and contract snapshots.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc's strict-allow-scripts is enforced from npm 11.18 on; older npm would ignore it.
      - name: Use npm 11.18 or later
        run: |
          if ! npx -y semver@7.7.3 -r '>=11.18.0' "$(npm --version)" >/dev/null; then
            npm install -g npm@11.19.1
          fi
          npm --version
      - run: npm ci
      - name: Lint
        if: matrix.node == 24
        run: npm run lint
      - name: Honesty guard
        if: matrix.node == 24
        run: npm run guard:honest -- --base HEAD^1
      # The contract is additive-only: compare the schemas with the parent commit's snapshots.
      - name: Contract compatibility
        if: matrix.node == 24
        run: npm run contract:check -- --base HEAD^1
      - run: npm run typecheck
      - name: Unit and route tests (Vitest)
        run: npm test
      - run: npm run build

  e2e:
    name: browser tests (Playwright, mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use npm 11.18 or later
        run: |
          if ! npx -y semver@7.7.3 -r '>=11.18.0' "$(npm --version)" >/dev/null; then
            npm install -g npm@11.19.1
          fi
          npm --version
      - run: npm ci
      # Uses the Google Chrome preinstalled on the runner image; no browser download.
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: audio service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/audio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/audio/uv.lock
      - name: Ruff
        run: |
          uv run --frozen --only-group dev ruff check .
          uv run --frozen --only-group dev ruff format --check .
      - run: uv sync --frozen
      # Exit code 5 means "no tests collected": the service has no tests yet.
      # Remove the allowance once the audio test suite exists (#14).
      - name: Pytest
        run: uv run --frozen pytest || [ $? -eq 5 ]
