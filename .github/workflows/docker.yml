name: docker

# Builds every image when anything that goes into an image changes.
on:
  pull_request:
    paths:
      - "apps/*/Dockerfile*"
      - "apps/web/nginx.conf"
      - "apps/*/package.json"
      - "services/audio/**"
      - "packages/*/package.json"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/*/Dockerfile*"
      - "apps/web/nginx.conf"
      - "apps/*/package.json"
      - "services/audio/**"
      - "packages/*/package.json"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml points the API at apps/api/.env; images never contain it.
      - name: Create an empty API env file
        run: touch apps/api/.env
      - name: Build all images
        run: docker compose build
