name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: newer pushes cancel older runs. main: one group per commit, so every merge is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # npm ci installs what the lock names without checking its age: every lock entry that is new or
  # changed against the base must be an npmjs release at least 14 days old (or min-release-age in
  # .npmrc, if larger). Its own job, with no install, so a registry outage hides no other result.
  release-age:
    name: release age of changed npm lock entries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request compares with the merge commit's parent; a push compares with the commit
          # before the push, which the full history holds unless the push was forced.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release age of changed lock entries
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          # A push that creates the branch has an all-zero "before".
          if [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            # After a force-push the commit before it is not in the history: fetch it.
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$BEFORE"; then
              base=$BEFORE
            else
              echo "::notice::cannot fetch $BEFORE, the commit before the push; comparing with HEAD^1"
            fi
          fi
          node scripts/check-release-age.mjs --base "$base"

  node:
    name: lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The parent commit holds the base branch's guard baselines and contract snapshots.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc's strict-allow-scripts is enforced from npm 11.18 on; older npm would ignore it.
      - name: Use npm 11.18 or later
        run: |
          if ! npx -y semver@7.7.3 -r '>=11.18.0' "$(npm --version)" >/dev/null; then
            npm install -g npm@11.19.1
          fi
          npm --version
      - run: npm ci
      # The contract tests validate the audio JSON Schema with Python jsonschema, run through uv.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Lint
        if: matrix.node == 24
        run: npm run lint
      - name: Honesty guard
        if: matrix.node == 24
        run: npm run guard:honest -- --base HEAD^1
      # The contract is additive-only: compare the schemas with the parent commit's snapshots.
      - name: Contract compatibility
        if: matrix.node == 24
        run: npm run contract:check -- --base HEAD^1
      - run: npm run typecheck
      - name: Unit and route tests (Vitest)
        run: npm test
      # The eval scripts' own tests (evals/agent, evals/scripts): no network, no model. After
      # npm test, whose build step the perturbation tests need: they load the app's numeric check.
      - name: Eval tests (node --test)
        run: node --test 'evals/**/*.test.mjs'
      # The API tests must not depend on a developer's settings: run them again with the example
      # settings file in place (as after `cp .env.example .env`) plus a valid, non-default value
      # for every setting the tests pin, so a pin that goes missing fails here.
      - name: API tests with apps/api/.env from .env.example
        if: matrix.node == 24
        run: |
          test ! -e apps/api/.env || { printf 'apps/api/.env already exists\n' >&2; exit 1; }
          cp apps/api/.env.example apps/api/.env
          printf '\n' >> apps/api/.env
          printf '%s\n' \
            RATE_LIMIT_MAX=1 RATE_LIMIT_GLOBAL_MAX=1 SEARCH_RATE_LIMIT_MAX=1 \
            HOST=::1 TRUST_PROXY=1 REPLAY_MODE=only SOURCE_CASSETTE=replay \
            CHECKPOINT_RETENTION_HOURS=1 AZURE_OPENAI_API_KEY=synthetic-ci-key \
            LLM_CASSETTE=record LLM_SPEND_LOG=/nonexistent/llm-spend.jsonl >> apps/api/.env
          npx vitest run --project api
          rm apps/api/.env
      # Replay mode on a fresh checkout with no settings file: the API is started with
      # REPLAY_MODE=only, dummy keys and every outbound connection refused and counted
      # (tests/deny-network.mjs); it must replay the recorded runs with 0 attempts.
      - name: Replay with the network denied
        if: matrix.node == 24
        run: |
          test ! -e apps/api/.env || { printf 'apps/api/.env exists\n' >&2; exit 1; }
          npm run test:replay
      # The agent eval's CI subset, replayed through the API from the committed cassettes with
      # every outbound connection refused and counted: each run must give its committed records
      # (rows b, c and d), with 0 attempts and 0 spend lines.
      - name: Agent eval replay (regression check)
        if: matrix.node == 24
        env:
          npm_config_update_notifier: "false"
        run: |
          test ! -e apps/api/.env || { printf 'apps/api/.env exists\n' >&2; exit 1; }
          NODE_OPTIONS="--import $GITHUB_WORKSPACE/tests/deny-network.mjs" npm run eval -- --suite agent --mode replay --subset ci
      - run: npm run build
      # vite build exits 0 with invalid or unprocessed CSS; check what it wrote.
      - name: Built CSS
        run: npm run check:css

  e2e:
    name: browser tests (Playwright, mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use npm 11.18 or later
        run: |
          if ! npx -y semver@7.7.3 -r '>=11.18.0' "$(npm --version)" >/dev/null; then
            npm install -g npm@11.19.1
          fi
          npm --version
      - run: npm ci
      # The web app imports @liner-notes/contract, whose dist/ is not in the repository.
      - run: npm run build -w packages/contract
      # Uses the Google Chrome preinstalled on the runner image; no browser download.
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: audio service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/audio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/audio/uv.lock
      - name: Ruff
        run: |
          uv run --frozen --only-group dev ruff check .
          uv run --frozen --only-group dev ruff format --check .
      # Without the "models" extra: the suite covers the service as it runs without Essentia.
      # The seeded control families (pytest marker "seeded") run in python-seeded and
      # python-seeded-chords, in parallel.
      - run: uv sync --frozen
      - name: Pytest
        run: |
          uv run --frozen python -VV
          uv run --frozen pytest -rsxX -m "not seeded"

  python-seeded:
    name: audio service, seeded one-pitch-class, pitchless and softer-third families (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/audio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/audio/uv.lock
      # Drums and one pitched source at 30 seeds each, pinned seed by seed (librosa here; the
      # Essentia half runs in audio-models), and triads with a softer third over a doubled root.
      # The chord families and seventh chords run in python-seeded-chords: the two -k
      # expressions are complements, so every seeded test runs in exactly one of the two jobs.
      - run: uv sync --frozen
      - name: Pytest
        run: |
          uv run --frozen python -VV
          uv run --frozen pytest -rsxX -m seeded -k "not (chords_keep_the_key or seventh_chord)"

  python-seeded-chords:
    name: audio service, seeded chord families and seventh chords (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/audio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/audio/uv.lock
      # Chords that hold still and keep their key, 30 seeds each, and seventh chords with a quiet
      # third: the single-source rule must withhold none of them. The rule and the other key rules are the same with or without
      # Essentia, so these run here only.
      - run: uv sync --frozen
      - name: Pytest
        run: |
          uv run --frozen python -VV
          uv run --frozen pytest -rsxX -m seeded -k "chords_keep_the_key or seventh_chord"
