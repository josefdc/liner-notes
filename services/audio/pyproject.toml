[project]
name = "sonic-audio-analysis"
version = "1.0.0"
description = "Liner Notes audio analysis service: measures tempo, key and audio features from 30-second previews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "audioread>=3.1.0",
    "essentia-tensorflow>=2.1b6.dev1389",
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
    "soundfile>=0.13.1",
    "uvicorn>=0.38.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
