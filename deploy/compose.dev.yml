# Runs the production images on a machine without Cloudflare (local tries and CI), as a project
# of its own:
#
#   docker compose -f deploy/compose.prod.yml build api audio      # the production images, once
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.dev.yml up -d --build
#
# The project is "liner-notes-dev", never the production project "liner-notes": its containers,
# volumes (database included) and network are its own, so starting it never replaces or touches a
# deployment on the same machine. Do not give it another name with -p or COMPOSE_PROJECT_NAME.
# Caddy serves plain HTTP on 127.0.0.1:${DEV_PROXY_PORT:-3182}, whatever deploy/.env says.
#
# The API runs in development, so with no Turnstile secret it accepts the development bypass,
# which this project's own web image (<IMAGE_PREFIX>-web-dev, built without a Turnstile site key)
# sends; run tokens are still issued and checked. The API and audio images are the production
# ones, used as they are: this project never builds, pulls or retags them (build is reset
# below, and --build builds the web-dev image only). The settings compose.prod.yml requires
# must still be set (test values do).

name: liner-notes-dev

services:
  web:
    image: ${IMAGE_PREFIX:-liner-notes}-web-dev:${IMAGE_TAG:-latest}
    build:
      args:
        VITE_TURNSTILE_SITE_KEY: ""
    ports: !override
      - target: 80
        published: "${DEV_PROXY_PORT:-3182}"
        host_ip: 127.0.0.1
        protocol: tcp
    # Not the deployment's site.d (its certificate settings are for the site's hostname).
    volumes: !override
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ":80"

  api:
    build: !reset null
    pull_policy: never
    environment:
      NODE_ENV: development
      TURNSTILE_SECRET_KEY: ""
      TURNSTILE_EXPECTED_HOSTNAME: ""
      # This project's own origin.
      CORS_ORIGINS: http://127.0.0.1:${DEV_PROXY_PORT:-3182},http://localhost:${DEV_PROXY_PORT:-3182}
      # Recorded runs only by default, whatever REPLAY_MODE deploy/.env sets: nothing calls a
      # paid service.
      REPLAY_MODE: ${DEV_REPLAY_MODE:-only}
      # Holds a replayed stream open this many milliseconds, with heartbeats, before its first
      # event (the long-stream check through Caddy). The API accepts it only in development.
      SSE_HOLD_MS: ${SSE_HOLD_MS:-0}

  audio:
    build: !reset null
    pull_policy: never
