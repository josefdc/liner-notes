# =============================================================================
# Sonic Agent - Docker Compose Orchestration
# Production-ready configuration for all three services
# =============================================================================

services:
  # ==========================================================================
  # sonic-web: React/Vite Frontend (Nginx)
  # ==========================================================================
  sonic-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sonic-web
    ports:
      - "80:80"
    depends_on:
      sonic-server:
        condition: service_healthy
    networks:
      - sonic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # sonic-server: Node.js/LangGraph Backend
  # ==========================================================================
  sonic-server:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sonic-server
    # Browsers reach the API through the web container's nginx (/api), so the port is published on
    # the host's loopback only, for local checks such as curl http://127.0.0.1:3001/api/health.
    # Published on every interface, a client could bypass nginx and choose its own
    # X-Forwarded-For, which TRUST_PROXY=1 below trusts for the rate-limit key.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      sonic-analysis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    # Values here override apps/api/.env. CORS_ORIGINS comes from the shell running compose
    # (default: http://localhost and http://127.0.0.1), not from apps/api/.env. The web app calls
    # /api on its own origin and needs no CORS entry; list other origins that call the API.
    # TRUST_PROXY=1: every request arrives from nginx, which sets X-Forwarded-For, so the per-IP
    # rate limits key on the browser's address instead of one shared bucket for nginx.
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - TRUST_PROXY=1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      - AUDIO_ANALYSIS_URL=http://sonic-analysis:3002
      - SQLITE_DB_PATH=/app/data/sonic-agent.db
    volumes:
      - sonic-data:/app/data
    networks:
      - sonic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # sonic-analysis: Python/FastAPI Audio Analysis
  # ==========================================================================
  sonic-analysis:
    build:
      context: ./services/audio
      dockerfile: Dockerfile
    container_name: sonic-analysis
    ports:
      - "3002:3002"
    networks:
      - sonic-network
    restart: unless-stopped
    # Resource limits for audio processing
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sonic-data:

networks:
  sonic-network:
    driver: bridge
