name: docker

# Builds every image when files that can go into an image change.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # docker-compose.yml points the API at apps/api/.env; images never contain it.
      - name: Create an empty API env file
        run: touch apps/api/.env
      - uses: docker/setup-buildx-action@v4
      # Builds the services defined in docker-compose.yml, reusing layers from earlier runs.
      - name: Build all images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
