[project]
name = "liner-notes-evals-audio"
# Never published.
version = "0.0.0"
description = "Accuracy of the audio service's tempo and key estimates on annotated datasets"
readme = "README.md"
# SPDX expression (PEP 639); the full text is LICENSE at the repository root.
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
# The harness imports the service's own modules (services/audio is put on sys.path, see
# evals_audio/service.py), so the service's runtime dependencies are needed here, at the
# versions its lock pins: the constraints below keep the numerics identical, and
# tests/test_service_pins.py fails when the two locks drift apart.
dependencies = [
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "librosa==1.0.0",
    "mirdata==1.0.0",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
# The Essentia estimators (essentia-tensorflow, as the service's "models" extra).
models = [
    "essentia-tensorflow==2.1b6.dev1389",
]
# The beat-this tracker (Foscarin et al. 2024), compared with the service's estimators on tempo.
# Evaluation only: the service does not depend on it. torch comes from the CPU-only index, at
# the version of the last torchaudio release (2.11.0), which is built against it.
beat-this = [
    "beat-this==1.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[tool.uv]
package = true
# Only resolve releases that have been public for two weeks.
exclude-newer = "14 days"
# ruff 0.17.1 (2026-10-15) was pinned before this rule; the exception can go after 2026-10-29.
exclude-newer-package = { ruff = "2026-10-16T00:00:00Z" }
# mirdata asks for smart-open[all], which brings the AWS, Azure and Google Cloud SDKs; it only
# opens local files and HTTP URLs here, so the plain package is enough.
override-dependencies = ["smart-open>=5.0.0"]
# Every package services/audio/uv.lock resolves, at its locked version, so the harness runs the
# service with the same libraries (numerics and web stack alike). tests/test_service_pins.py
# fails when a package both locks share differs; no difference is allowed. After the service's
# lock changes, regenerate this list from it and run `uv lock`.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.0",
    "attrs==26.1.0",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "decorator==5.2.1",
    "essentia-tensorflow==2.1b6.dev1389",
    "fastapi==0.125.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "iniconfig==2.3.0",
    "joblib==1.5.3",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "lazy-loader==0.4",
    "librosa==1.0.0",
    "llvmlite==0.46.0",
    "msgpack==1.1.2",
    "numba==0.63.1",
    "numpy==2.3.5",
    "packaging==25.0",
    "platformdirs==4.5.1",
    "pluggy==1.6.0",
    "pooch==1.8.2",
    "pycparser==2.23",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.32.5",
    "rpds-py==2026.9.1",
    "ruff==0.17.1",
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
    "six==1.17.0",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "starlette==0.50.0",
    "threadpoolctl==3.6.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.2",
    "uvicorn==0.38.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals_audio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
