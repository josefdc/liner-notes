name: docker

# Builds every image when files that can go into an image change.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # docker-compose.yml points the API at apps/api/.env; images never contain it.
      - name: Create an empty API env file
        run: touch apps/api/.env
      - uses: docker/setup-buildx-action@v4
      # Builds the services defined in docker-compose.yml, reusing layers from earlier runs.
      # Pull requests read the layer cache; only main writes it, which keeps the cache small.
      - name: Build all images (read cache)
        if: github.event_name != 'push'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          set: |
            sonic-web.cache-from=type=gha,scope=sonic-web
            sonic-server.cache-from=type=gha,scope=sonic-server
            sonic-analysis.cache-from=type=gha,scope=sonic-analysis
      - name: Build all images (read and write cache)
        if: github.event_name == 'push'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          set: |
            sonic-web.cache-from=type=gha,scope=sonic-web
            sonic-web.cache-to=type=gha,scope=sonic-web,mode=max
            sonic-server.cache-from=type=gha,scope=sonic-server
            sonic-server.cache-to=type=gha,scope=sonic-server,mode=max
            sonic-analysis.cache-from=type=gha,scope=sonic-analysis
            sonic-analysis.cache-to=type=gha,scope=sonic-analysis,mode=max
      # Loads the audio image (its layers come from the build above) to check how it runs:
      # as a non-root user, decoding and analysing a generated clip offline, and serving
      # /health as "degraded" when the models are not downloaded.
      - name: Load the audio image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: sonic-analysis
          load: true
          set: |
            sonic-analysis.tags=liner-notes-audio:ci
            sonic-analysis.cache-from=type=gha,scope=sonic-analysis
      - name: Check the audio image
        run: |
          uid=$(docker run --rm liner-notes-audio:ci id -u)
          echo "audio image runs as uid $uid"
          test "$uid" -ne 0

          docker run --rm --network none liner-notes-audio:ci sh -c '
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=5" /tmp/tone.mp3 &&
            python -c "import main; print(main.analyze_audio_file(\"/tmp/tone.mp3\"))"'

          docker run -d --name audio-smoke -e AUDIO_FETCH_MODELS=0 -p 127.0.0.1:3102:3002 \
            liner-notes-audio:ci
          trap 'docker logs audio-smoke; docker rm -f audio-smoke' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3102/health && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:3102/health | grep -q '"status":"degraded","version":"[^"]*","models":false'
          test "$(docker exec audio-smoke id -u)" -ne 0
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3102/analyze-test)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3102/analyze \
            -H 'content-type: application/json' \
            -d '{"preview_url":"http://169.254.169.254/#dzcdn.net"}')" = 400

          # Docker's own health check must turn healthy (it waits for the first interval).
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' audio-smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health status: $status"
          test "$status" = healthy

          # A failed model download (no network) must leave the service running, degraded.
          docker run -d --name audio-offline --network none -e MODEL_FETCH_TIMEOUT_S=10 \
            liner-notes-audio:ci
          trap 'docker logs audio-smoke; docker rm -f audio-smoke audio-offline' EXIT
          for _ in $(seq 1 30); do
            docker exec audio-offline python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:3002/health', timeout=2).read().decode())" > offline-health.json 2>/dev/null && break
            sleep 2
          done
          cat offline-health.json
          grep -q '"status":"degraded"' offline-health.json
