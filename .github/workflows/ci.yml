name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc's strict-allow-scripts is enforced from npm 11.18 on; older npm would ignore it.
      - name: Use npm 11.18 or later
        run: |
          if ! npx -y semver@7.7.3 -r '>=11.18.0' "$(npm --version)" >/dev/null; then
            npm install -g npm@11.19.1
          fi
          npm --version
      - run: npm ci
      - name: Lint
        if: matrix.node == 24
        run: npm run lint
      - name: Honesty guard
        if: matrix.node == 24
        run: npm run guard:honest
      - run: npm run typecheck
      - name: API tests
        run: |
          npm run test:db -w apps/api
          npm run test:lastfm -w apps/api
        env:
          SQLITE_DB_PATH: ${{ runner.temp }}/ci.db
      - run: npm run build

  python:
    name: audio service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/audio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: services/audio/uv.lock
      - name: Ruff
        run: |
          uv run --frozen --only-group dev ruff check .
          uv run --frozen --only-group dev ruff format --check .
      - run: uv sync --frozen
      # Exit code 5 means "no tests collected": the service has no tests yet.
      # Remove the allowance once the audio test suite exists (#14).
      - name: Pytest
        run: uv run --frozen pytest || [ $? -eq 5 ]
