name: docker

# Builds every image when files that can go into an image change.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "fixtures/replays/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/audio/**"
      - "fixtures/replays/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # deploy/compose.prod.yml requires these secrets: fake values here (nothing in this job asks
    # Cloudflare, and the API never runs with a real key).
    env:
      RUN_TOKEN_SECRET: ci-only-run-token-secret-not-for-any-deployment
      TURNSTILE_SECRET_KEY: ci-only-turnstile-secret
      AUDIO_SERVICE_TOKEN: ci-only-audio-service-token
      LOG_IP_SALT: ci-only-log-ip-salt
      # The local site's origin (deploy/check-stack.sh sends it), and Cloudflare's public
      # always-passing test site key (nothing here loads the widget).
      CORS_ORIGINS: http://127.0.0.1:3180,http://localhost:3180
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Builds the services defined in deploy/compose.prod.yml, reusing layers from earlier runs.
      # Pull requests read the layer cache; only main writes it, which keeps the cache small.
      # Bake takes the compose file's build contexts as relative to the working directory, not
      # to the file, so each is set here from the repository root.
      - name: Build all images (read cache)
        if: github.event_name != 'push'
        uses: docker/bake-action@v7
        with:
          source: .
          files: deploy/compose.prod.yml
          set: |
            web.context=.
            api.context=.
            audio.context=services/audio
            audio.platform=linux/amd64
            web.cache-from=type=gha,scope=web
            api.cache-from=type=gha,scope=api
            audio.cache-from=type=gha,scope=audio
      - name: Build all images (read and write cache)
        if: github.event_name == 'push'
        uses: docker/bake-action@v7
        with:
          source: .
          files: deploy/compose.prod.yml
          set: |
            web.context=.
            api.context=.
            audio.context=services/audio
            audio.platform=linux/amd64
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            audio.cache-from=type=gha,scope=audio
            audio.cache-to=type=gha,scope=audio,mode=max
      # Loads the three images (their layers come from the build above) under their names in
      # deploy/compose.prod.yml (liner-notes-<service>:latest), for the checks below and the
      # stacks'.
      - name: Load the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: deploy/compose.prod.yml
          load: true
          set: |
            web.context=.
            api.context=.
            audio.context=services/audio
            audio.platform=linux/amd64
            web.cache-from=type=gha,scope=web
            api.cache-from=type=gha,scope=api
            audio.cache-from=type=gha,scope=audio
      # Checks how the audio image runs: as a non-root user, without ffmpeg or wget, analysing a
      # generated band offline (as MP3 and as WAV) with the Essentia estimators
      # (RhythmExtractor2013 and KeyExtractor), refusing M4A and AAC as a format it does not
      # decode, and serving /health as "degraded" when the models are not downloaded.
      - name: Check the audio image
        run: |
          echo "audio image size: $(docker image inspect -f '{{.Size}}' liner-notes-audio:latest | numfmt --to=iec)"
          uid=$(docker run --rm liner-notes-audio:latest id -u)
          echo "audio image runs as uid $uid"
          test "$uid" -ne 0

          # The runtime stage has no ffmpeg or wget: soundfile decodes the previews, and the
          # health check is Python. A shell in the same image must first find python, so a
          # "not found" below cannot come from a shell or a docker run that failed.
          docker run --rm --entrypoint sh liner-notes-audio:latest -c 'command -v python'
          for tool in ffmpeg wget; do
            # 0 only when the shell ran and found no $tool: 1 when it found one, 125-127 when
            # docker run or the shell failed.
            status=0
            docker run --rm --entrypoint sh liner-notes-audio:latest -c "! command -v $tool" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "the audio image has $tool, or the check did not run (exit $status)"
              exit 1
            fi
          done

          # 30 s of kick, snare and an Am-F-C-G pad at 120 BPM, written as MP3 in the container:
          # the default (Essentia) estimators must report its tempo and a key. The same band as
          # WAV must decode to the same tempo.
          docker run --rm -i --network none liner-notes-audio:latest python - <<'PY'
          import numpy as np
          import soundfile as sf

          import estimators
          import main

          assert estimators.ESSENTIA_AVAILABLE and main.ESTIMATOR.name == "essentia", main.ESTIMATOR.name
          sr, bpm = 44100, 120
          y = np.zeros(30 * sr)
          t = np.arange(sr // 4) / sr
          kick = np.sin(2 * np.pi * (50 + 80 * np.exp(-t / 0.03)) * t) * np.exp(-t / 0.12)
          snare = np.random.default_rng(1).standard_normal(t.size) * np.exp(-t / 0.06)
          chords = [(220.0, 261.63, 329.63), (174.61, 220.0, 261.63), (130.81, 164.81, 196.0),
                    (196.0, 246.94, 293.66)]
          for n, beat in enumerate(np.arange(0, 30, 60 / bpm)):
              i = int(beat * sr)
              hit = (kick if n % 2 == 0 else 0.5 * snare)[: y.size - i]
              y[i : i + hit.size] += hit
              if n % 4 == 0:
                  tb = np.arange(min(int(4 * 60 / bpm * sr), y.size - i)) / sr
                  pad = sum(np.sin(2 * np.pi * f * tb) for f in chords[(n // 4) % 4])
                  y[i : i + tb.size] += 0.15 * pad * np.exp(-tb / 3)
          sf.write("/tmp/band.mp3", (0.8 * y / np.abs(y).max()).astype(np.float32), sr, format="MP3")
          result = main.analyze_audio_file("/tmp/band.mp3")
          v2 = result["v2"]
          print({key: v2[key] for key in ("analyzerVersion", "gate", "tempo", "key")})
          assert v2["tempo"]["method"].startswith("essentia.RhythmExtractor2013"), v2["tempo"]
          assert set(result) == {"v2"}, sorted(result)
          assert abs(v2["tempo"]["bpm"] - 120) <= 1, v2["tempo"]
          assert v2["key"]["method"] == "essentia.KeyExtractor", v2["key"]
          sf.write("/tmp/band.wav", (0.8 * y / np.abs(y).max()).astype(np.float32), sr, format="WAV")
          wav = main.analyze_audio_file("/tmp/band.wav")["v2"]
          assert abs(wav["tempo"]["bpm"] - 120) <= 1, wav["tempo"]
          PY

          # The image's libsndfile reads no M4A or AAC (ADTS or LOAS), so the service refuses the
          # test fixtures with that reason, not the generic decode failure. If it ever reads
          # them, the refusal is out of date.
          docker run --rm -i --network none \
            -v "$GITHUB_WORKSPACE/services/audio/tests/fixtures:/fixtures:ro" \
            liner-notes-audio:latest python - <<'PY'
          import soundfile as sf

          import main

          for name in ("tone.m4a", "tone.aac", "tone.latm"):
              path = f"/fixtures/{name}"
              try:
                  sf.info(path)
              except sf.LibsndfileError:
                  pass
              else:
                  raise AssertionError(f"libsndfile reads {name}: the refusal is out of date")
              try:
                  main.decode(path)
              except main.InvalidAudioError as e:
                  assert str(e) == main.UNSUPPORTED_FORMAT, (name, str(e))
                  print(f"{name}: refused: {e}")
              else:
                  raise AssertionError(f"{name} was decoded")
          PY

          docker run -d --name audio-smoke -e AUDIO_FETCH_MODELS=0 -p 127.0.0.1:3102:3002 \
            liner-notes-audio:latest
          trap 'docker logs audio-smoke; docker rm -f audio-smoke' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3102/health && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:3102/health | grep -q '"status":"degraded","analyzer_version":"[^"]*","models":false'
          test "$(docker exec audio-smoke id -u)" -ne 0
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3102/analyze-test)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3102/analyze \
            -H 'content-type: application/json' \
            -d '{"preview_url":"http://169.254.169.254/#dzcdn.net"}')" = 400

          # Docker's own health check must turn healthy (it waits for the first interval).
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' audio-smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health status: $status"
          test "$status" = healthy

          # A failed model download (no network) must leave the service running, degraded.
          docker run -d --name audio-offline --network none -e MODEL_FETCH_TIMEOUT_S=10 \
            liner-notes-audio:latest
          trap 'docker logs audio-smoke; docker rm -f audio-smoke audio-offline' EXIT
          for _ in $(seq 1 30); do
            docker exec audio-offline python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:3002/health', timeout=2).read().decode())" > offline-health.json 2>/dev/null && break
            sleep 2
          done
          cat offline-health.json
          grep -q '"status":"degraded"' offline-health.json
      # Checks how the API image runs: Node 24, as a non-root user, without wget, with the native
      # SQLite module loading (/api/ready), the recorded replays served (/api/replays), the run
      # report reading the API's database, and Docker's health check (Node's fetch) turning
      # healthy.
      - name: Check the API image
        run: |
          echo "API image size: $(docker image inspect -f '{{.Size}}' liner-notes-api:latest | numfmt --to=iec)"
          docker run --rm liner-notes-api:latest node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          uid=$(docker run --rm liner-notes-api:latest id -u)
          echo "API image runs as uid $uid"
          test "$uid" -ne 0
          # No wget (the health check is Node). As in the audio check: a shell in the same image
          # must find node first, and only exit 0 means the shell ran and found no wget.
          docker run --rm --entrypoint sh liner-notes-api:latest -c 'command -v node'
          status=0
          docker run --rm --entrypoint sh liner-notes-api:latest -c '! command -v wget' || status=$?
          if [ "$status" -ne 0 ]; then
            echo "the API image has wget, or the check did not run (exit $status)"
            exit 1
          fi

          # The image runs with NODE_ENV=production, which does not start without the run token
          # and Turnstile secrets: fake values here (nothing in this check asks Cloudflare).
          docker run -d --name api-smoke -e REPLAY_MODE=only \
            -e RUN_TOKEN_SECRET=ci-only-run-token-secret-not-for-any-deployment \
            -e TURNSTILE_SECRET_KEY=ci-only-turnstile-secret \
            -p 127.0.0.1:3101:3001 liner-notes-api:latest
          trap 'docker logs api-smoke; docker rm -f api-smoke' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3101/api/ready && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:3101/api/ready | grep -q '"status":"ready"'
          # The recorded replays ship in the image (REPLAY_DIR's default): the list is not empty.
          curl -fsS http://127.0.0.1:3101/api/replays > replays.json
          jq -e '.success and (.replays | length > 0)' replays.json
          test "$(docker exec api-smoke id -u)" -ne 0
          # The run report, as the API's user, against the database the API has open.
          # Written to a file, not piped, so the step fails when the report exits non-zero.
          docker exec api-smoke node dist/report.js --days 1 > report.txt
          cat report.txt
          grep -q '^total ' report.txt
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api-smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health status: $status"
          test "$status" = healthy
      # The production stack on this runner, through Caddy (deploy/check-stack.sh, which runs the
      # same way on a development machine): every service healthy, no published port but Caddy's,
      # a stream without a run token refused, the security headers and the policy on a page, a
      # hashed asset, an API answer and an error, the cache rules, /apifoo not proxied, forged
      # CF-Connecting-IP and X-Forwarded-For ignored and CF-Connecting-IP used from a trusted
      # peer, and the run token and what a visitor looked up kept out of Caddy's log.
      # The audio service skips its model download here (it serves "degraded", and is healthy).
      - name: Check the production stack
        env:
          AUDIO_FETCH_MODELS: "0"
        run: |
          trap 'docker compose -f deploy/compose.prod.yml logs --no-color --tail 50' EXIT
          docker compose -f deploy/compose.prod.yml up -d --no-build --wait --wait-timeout 300
          deploy/check-stack.sh
      # The development stack (deploy/compose.dev.yml), a project of its own next to the one
      # above, whose API issues run tokens without Turnstile and holds replayed streams 130 s
      # (SSE_HOLD_MS): a stream the visitor leaves puts no token, query or full address in
      # Caddy's log, and a held stream passes through Caddy and ends with "done". The production
      # project's API must be the same container afterwards.
      # The development stack's own web image: the page built without a site key.
      - name: Load the development web image
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            deploy/compose.prod.yml
            deploy/compose.dev.yml
          targets: web
          load: true
          set: |
            web.context=.
            web.cache-from=type=gha,scope=web
      - name: Check a cut and a 130 s stream through Caddy
        env:
          AUDIO_FETCH_MODELS: "0"
          SSE_HOLD_MS: "130000"
        run: |
          trap 'docker compose -f deploy/compose.prod.yml -f deploy/compose.dev.yml down -v; docker compose -f deploy/compose.prod.yml down -v' EXIT
          api=$(docker compose -f deploy/compose.prod.yml ps -q api)
          docker compose -f deploy/compose.prod.yml -f deploy/compose.dev.yml up -d --no-build \
            --wait --wait-timeout 300
          deploy/check-stack.sh long-stream
          test "$(docker compose -f deploy/compose.prod.yml ps -q api)" = "$api"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$api" | grep -qx NODE_ENV=production
