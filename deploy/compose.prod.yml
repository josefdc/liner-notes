# Liner Notes in production: Caddy in front (web), the API (api) and the audio service (audio).
#
#   cp deploy/.env.example deploy/.env && chmod 600 deploy/.env   # then fill it in
#   docker compose -f deploy/compose.prod.yml up -d --build
#
# Compose reads deploy/.env (the directory of this file) for the ${...} values below; another
# file can be named with --env-file. Only the web service publishes a port: by default
# 127.0.0.1:3180 for local use; in production PROXY_BIND=0.0.0.0, PROXY_PORT=80 and
# PROXY_TLS_PORT=443, with SITE_ADDRESS set to the site's hostname. The API and the audio
# service publish nothing: browsers reach the API through Caddy only (/api/*), and only the API
# calls the audio service. See docs/deployment.md.
#
# deploy/compose.dev.yml runs the same images on a machine without Cloudflare, as a project of
# its own (liner-notes-dev) that never touches this one.

name: liner-notes

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Caddy: serves the built app and forwards /api/* to the API (apps/web/Caddyfile).
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:-liner-notes}-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Public: it ships in the page. Required: without it the page sends the development
        # bypass, which the API here refuses (compose.dev.yml builds its own page without it).
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?set VITE_TURNSTILE_SITE_KEY in deploy/.env (the Turnstile widget's site key)}
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-}
    ports:
      - target: 80
        published: "${PROXY_PORT:-3180}"
        host_ip: "${PROXY_BIND:-127.0.0.1}"
        protocol: tcp
      # HTTPS, when SITE_ADDRESS is a hostname (Caddy redirects port 80 to it; docs/deployment.md,
      # "Certificates").
      - target: 443
        published: "${PROXY_TLS_PORT:-3181}"
        host_ip: "${PROXY_BIND:-127.0.0.1}"
        protocol: tcp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Proxy ranges to trust for CF-Connecting-IP besides Cloudflare's own (space-separated).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      # Certificates Caddy obtains, and its state.
      - caddy-data:/data
      - caddy-config:/config
      # The deployment's own site settings and certificate files, read-only: *.caddy files are
      # read into the site (deploy/site.d/origin-ca.caddy.example). Nothing there by default.
      - ./site.d:/etc/caddy/site.d:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [liner-notes]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The API (Node). Its secrets and keys come from the environment below, never from a file in
  # the image.
  api:
    <<: *hardening
    image: ${IMAGE_PREFIX:-liner-notes}-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      # Every request comes through Caddy, which sends one X-Forwarded-For: the visitor's address.
      TRUST_PROXY: "1"
      # Required: the site's own origin(s), as browsers send them (https://liner-notes.example;
      # locally http://127.0.0.1:3180). A browser that does not mark a request as same-origin
      # (no Sec-Fetch-Site header) is otherwise refused on the paid routes and on POST /api/runs.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in deploy/.env to the site's origin (https://<hostname>; locally http://127.0.0.1:3180)}
      # Live analysis when it can run; the recorded showcase runs when it cannot (no keys, no
      # spend log, the budget spent).
      REPLAY_MODE: ${REPLAY_MODE:-fallback}
      SQLITE_DB_PATH: /app/data/sonic-agent.db
      # The spend log lives on its own volume; live model calls are refused until it exists
      # (docs/deployment.md, "Deploying").
      LLM_SPEND_LOG: /app/spend/llm-spend.jsonl
      AUDIO_ANALYSIS_URL: http://audio:3002
      # Required: compose stops with these messages when one is missing.
      AUDIO_SERVICE_TOKEN: ${AUDIO_SERVICE_TOKEN:?set AUDIO_SERVICE_TOKEN in deploy/.env (shared by the API and the audio service)}
      RUN_TOKEN_SECRET: ${RUN_TOKEN_SECRET:?set RUN_TOKEN_SECRET in deploy/.env (openssl rand -base64 48)}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY in deploy/.env (the Turnstile widget's secret key)}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      LOG_IP_SALT: ${LOG_IP_SALT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Live analysis (REPLAY_MODE=fallback serves recordings without them).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_DEPLOYMENT_FAST: ${AZURE_OPENAI_DEPLOYMENT_FAST:-}
      AZURE_OPENAI_DEPLOYMENT_PRO: ${AZURE_OPENAI_DEPLOYMENT_PRO:-}
      AZURE_OPENAI_DEPLOYMENT_MAIN: ${AZURE_OPENAI_DEPLOYMENT_MAIN:-}
      AZURE_OPENAI_DEPLOYMENT_RESEARCH: ${AZURE_OPENAI_DEPLOYMENT_RESEARCH:-}
      AZURE_OPENAI_DEPLOYMENT_JUDGE: ${AZURE_OPENAI_DEPLOYMENT_JUDGE:-}
      BUDGET_TOTAL_USD: ${BUDGET_TOTAL_USD:-}
      BUDGET_DAILY_USD: ${BUDGET_DAILY_USD:-}
      BUDGET_EVAL_FLOOR_USD: ${BUDGET_EVAL_FLOOR_USD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      MAX_LLM_CALLS_PER_RUN: ${MAX_LLM_CALLS_PER_RUN:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-}
      # Sources (optional).
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      SHS_API_KEY: ${SHS_API_KEY:-}
      GENIUS_ACCESS_TOKEN: ${GENIUS_ACCESS_TOKEN:-}
      SOURCE_USER_AGENT: ${SOURCE_USER_AGENT:-}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
      SOURCE_TIMEOUT_MS: ${SOURCE_TIMEOUT_MS:-}
      # Limits (optional; empty keeps the API's defaults).
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-}
      SEARCH_RATE_LIMIT_WINDOW_MS: ${SEARCH_RATE_LIMIT_WINDOW_MS:-}
      SEARCH_RATE_LIMIT_MAX: ${SEARCH_RATE_LIMIT_MAX:-}
      # Retention (optional; empty keeps the API's defaults).
      CHECKPOINT_RETENTION_HOURS: ${CHECKPOINT_RETENTION_HOURS:-}
      STORE_RETENTION_DAYS: ${STORE_RETENTION_DAYS:-}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-}
      RUN_EVENT_RETENTION_DAYS: ${RUN_EVENT_RETENTION_DAYS:-}
    volumes:
      # The database. The file keeps its name. The volume is <project>_sonic-data, which is the
      # earlier root docker-compose.yml's volume only when that stack ran as the project
      # "liner-notes" (a checkout directory of that name); otherwise move the data over (docs/deployment.md).
      - sonic-data:/app/data
      - llm-spend:/app/spend
    tmpfs:
      - /tmp
    depends_on:
      audio:
        condition: service_started
    networks: [liner-notes]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      # The image has no wget: Node's fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health', { signal: AbortSignal.timeout(5000) }).then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # The audio analysis service (Python). Essentia publishes x86_64 Linux wheels only.
  audio:
    <<: *hardening
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-liner-notes}-audio:${IMAGE_TAG:-latest}
    build:
      context: ../services/audio
      dockerfile: Dockerfile
    environment:
      AUDIO_SERVICE_TOKEN: ${AUDIO_SERVICE_TOKEN:?set AUDIO_SERVICE_TOKEN in deploy/.env (shared by the API and the audio service)}
      # 0 skips the model download: the service then runs without its perceptual features
      # (/health "degraded").
      AUDIO_FETCH_MODELS: ${AUDIO_FETCH_MODELS:-1}
    volumes:
      # The Essentia models, fetched and verified at the first start, kept across restarts.
      - audio-models:/app/models
    tmpfs:
      - /tmp
    networks: [liner-notes]
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      # The image has no wget: Python's urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The entrypoint waits up to MODEL_FETCH_TIMEOUT_S (90 s) for the models before the
      # service starts.
      start_period: 150s
      start_interval: 5s

volumes:
  sonic-data:
  llm-spend:
  audio-models:
  caddy-data:
  caddy-config:

networks:
  liner-notes:
    driver: bridge
