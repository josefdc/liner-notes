name: Bug
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The live demo, or a local run (with REPLAY_MODE, Node version and OS).
